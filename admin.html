<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070a">
<link rel="icon" href="favicon.svg">
<title>Fichaje NFC · Panel</title>
<style>
  :root{ --bg:#05070a; --panel:#0d1218; --line:#1c2733; --tx:#e6f1ff; --dim:#7c8ea3; --ok:#17ff5f; --err:#ff4d5e; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:18px}
  .wrap{max-width:980px;margin:0 auto}
  h1{font-size:15px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim);font-weight:400;margin:0 0 18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  input,button,select{font:inherit}
  input,select{padding:11px;background:#070b0f;border:1px solid var(--line);border-radius:10px;color:var(--tx)}
  input:focus,select:focus{outline:none;border-color:var(--ok)}
  button{padding:11px 16px;border:0;border-radius:10px;background:var(--ok);color:#03130a;font-weight:700;cursor:pointer}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);font-weight:400}
  .fila{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--dim);font-weight:400;font-size:11px;text-transform:uppercase;letter-spacing:.12em}
  .scroll{overflow-x:auto}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px}
  .ent{background:rgba(23,255,95,.12);color:var(--ok)}
  .sal{background:rgba(255,77,94,.12);color:var(--err)}
  .dim{color:var(--dim)}
  .grande{font-size:26px;font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .err{color:var(--err)}
  a{color:var(--ok)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Fichaje NFC · Panel</h1>

  <div class="card" id="login">
    <div class="fila">
      <input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password">
      <button id="entrar">Entrar</button>
      <span id="msg" class="err"></span>
    </div>
  </div>

  <div id="app" style="display:none">
    <div class="card">
      <div class="fila">
        <label class="dim">Desde <input id="desde" type="date"></label>
        <label class="dim">Hasta <input id="hasta" type="date"></label>
        <button id="ver">Ver</button>
        <button id="csv" class="ghost">Descargar CSV</button>
        <span id="estado" class="dim"></span>
      </div>
    </div>

    <div class="card">
      <div class="dim" style="margin-bottom:10px">Ahora mismo dentro</div>
      <div class="grid" id="dentro"></div>
    </div>

    <div class="card">
      <div class="dim" style="margin-bottom:10px">Horas por empleado</div>
      <div class="scroll"><table id="tresumen"></table></div>
    </div>

    <div class="card">
      <div class="dim" style="margin-bottom:10px">Fichajes</div>
      <div class="scroll"><table id="tfilas"></table></div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var API = 'https://script.google.com/macros/s/AKfycbyWVqsrmBuAEKfT3gUFin219MvrGtmQRA5vBthaYH-XrnXpBnH99xj8Fzi850iIQroQ/exec';
  var hash = '', datos = null;
  var $ = function (id) { return document.getElementById(id); };

  var n = 0;
  function api(params, cb) {
    var nombre = 'jp_' + (++n) + '_' + Date.now();
    var s = document.createElement('script');
    var t = setTimeout(function () { limpiar(); cb({ ok: false, error: 'Sin respuesta' }); }, 25000);
    function limpiar() { clearTimeout(t); try { delete window[nombre]; } catch (e) {} if (s.parentNode) s.parentNode.removeChild(s); }
    window[nombre] = function (r) { limpiar(); cb(r); };
    s.src = API + '?' + Object.keys(params).map(function (k) { return k + '=' + encodeURIComponent(params[k]); }).join('&') + '&callback=' + nombre;
    s.onerror = function () { limpiar(); cb({ ok: false, error: 'Sin conexión' }); };
    document.body.appendChild(s);
  }

  function sha256(txt) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)).then(function (buf) {
      return Array.from(new Uint8Array(buf)).map(function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    });
  }

  function hm(min) { return Math.floor(min / 60) + ' h ' + ('0' + Math.round(min % 60)).slice(-2); }

  function cargar() {
    $('estado').textContent = 'Cargando…';
    api({ a: 'panel', pw: hash, desde: $('desde').value, hasta: $('hasta').value }, function (r) {
      if (!r.ok) { $('estado').innerHTML = '<span class="err">' + r.error + '</span>'; return; }
      datos = r;
      $('estado').textContent = r.filas.length + ' fichajes';

      $('dentro').innerHTML = r.dentro.length
        ? r.dentro.map(function (d) {
            return '<div class="card" style="margin:0;padding:12px"><div class="grande">' + d.nombre + '</div>' +
                   '<div class="dim">desde las ' + d.hora.slice(0, 5) + '</div></div>';
          }).join('')
        : '<div class="dim">Nadie ha fichado entrada.</div>';

      var ids = Object.keys(r.resumen);
      $('tresumen').innerHTML = ids.length
        ? '<tr><th>Empleado</th><th>Días</th><th>Total</th><th>Media/día</th></tr>' + ids.map(function (id) {
            var e = r.resumen[id], d = Object.keys(e.dias).length;
            return '<tr><td>' + e.nombre + '</td><td>' + d + '</td><td>' + hm(e.minutos) + '</td><td>' + hm(e.minutos / d) + '</td></tr>';
          }).join('')
        : '<tr><td class="dim">Sin datos en el periodo.</td></tr>';

      $('tfilas').innerHTML = '<tr><th>Fecha</th><th>Hora</th><th>Empleado</th><th>Tipo</th><th>Punto</th><th>Cont.</th><th>Geo</th></tr>' +
        r.filas.slice().reverse().map(function (f) {
          return '<tr><td>' + f.fecha + '</td><td>' + f.hora.slice(0, 5) + '</td><td>' + f.nombre + '</td>' +
                 '<td><span class="pill ' + (f.tipo === 'entrada' ? 'ent' : 'sal') + '">' + f.tipo + '</span></td>' +
                 '<td>' + f.punto + '</td><td class="dim">' + f.contador + '</td>' +
                 '<td>' + (f.geo ? '<a target="_blank" rel="noopener" href="https://maps.google.com/?q=' + f.geo + '">mapa</a>' : '<span class="dim">—</span>') + '</td></tr>';
        }).join('');
    });
  }

  $('entrar').addEventListener('click', function () {
    var v = $('pw').value;
    if (!v) return;
    $('msg').textContent = '';
    sha256(v).then(function (h) {
      hash = h;
      api({ a: 'panel', pw: hash, desde: $('desde').value, hasta: $('hasta').value }, function (r) {
        if (!r.ok) { $('msg').textContent = r.error; return; }
        sessionStorage.setItem('fichaje_pw', hash);
        $('login').style.display = 'none';
        $('app').style.display = '';
        cargar();
      });
    });
  });
  $('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('entrar').click(); });
  $('ver').addEventListener('click', cargar);

  $('csv').addEventListener('click', function () {
    if (!datos) return;
    var csv = 'fecha;hora;empleado;tipo;punto;contador;geo\n' + datos.filas.map(function (f) {
      return [f.fecha, f.hora, f.nombre, f.tipo, f.punto, f.contador, f.geo].join(';');
    }).join('\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 'fichajes_' + $('desde').value + '_' + $('hasta').value + '.csv';
    a.click();
  });

  var hoy = new Date(), pri = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
  var iso = function (d) { return d.toISOString().slice(0, 10); };
  $('desde').value = iso(pri);
  $('hasta').value = iso(hoy);

  var guardado = sessionStorage.getItem('fichaje_pw');
  if (guardado) {
    hash = guardado;
    $('login').style.display = 'none';
    $('app').style.display = '';
    cargar();
  }
})();
</script>
</body>
</html>
